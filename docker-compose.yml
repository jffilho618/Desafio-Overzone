version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overzone-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=docker_secret_key_change_in_production_32chars_minimum
      - JWT_EXPIRES_IN=7d
    volumes:
      - ./prisma:/app/prisma
      - ./src:/app/src
      - ./public:/app/public
      - node_modules:/app/node_modules
      - prisma_db:/app/prisma
    restart: unless-stopped
    command: npm run dev

volumes:
  node_modules:
  prisma_db:
